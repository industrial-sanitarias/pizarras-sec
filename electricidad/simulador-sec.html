<style>

button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.err{color:#b03a2e;font-size:14px;min-height:20px;margin-top:10px}
