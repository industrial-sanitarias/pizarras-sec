<style>

.err{color:#b03a2e;font-size:14px;min-height:20px;margin-top:10px}

async function open_(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.toUpperCase()),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));return new TextDecoder().decode(pt)}
async function go(pw,remember){try{const h=await open_(pw);if(remember){try{localStorage.setItem(K,pw)}catch(e){}}document.open();document.write(h);document.close();return true}catch(e){return false}}
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(e){}if(s&&await go(s,false))return;if(s){try{localStorage.removeItem(K)}catch(e){}}})();
document.getElementById("pw-gate").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Abriendo...";
